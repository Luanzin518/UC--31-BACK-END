<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante</title>

   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

    
    <header class="text-center p-4 bg-dark text-white">
        <h1>Restaurante</h1>
        <p>Bem-vindo ao nosso site</p>
    </header>


    
    <div id="carouselExampleIndicators" class="carousel slide">

        
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="{{ url_for('static', filename='banner1.jpg') }}" class="d-block w-100" alt="Imagem 1">
            </div>
            <div class="carousel-item">
                <img src="{{ url_for('static', filename='banner2.webp') }}" class="d-block w-100" alt="Imagem 2">
            </div>
            <div class="carousel-item">
                <img src="{{ url_for('static', filename='banner3.png') }}" class="d-block w-100" alt="Imagem 3">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>


   
    <main class="container mt-5">

        <section class="mb-4">
            <h2>Sobre nós</h2>
            <p>Um restaurante simples e acolhedor.</p>
        </section>

        <section class="mb-4">
            <h2>Cardápio</h2>
            <p>Confira nossos pratos disponíveis.</p>
        </section>

        <section class="mb-4">
            <h2>Contato</h2>
            <p>Entre em contato conosco.</p>
        </section>

    </main>


 
    <footer class="text-center bg-dark text-white p-3 mt-5">
        <p>© 2026 Restaurante</p>
    </footer>


    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
