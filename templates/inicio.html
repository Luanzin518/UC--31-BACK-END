<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Preferências</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{{ tema }}">


  {% if nome %}
    <h1>Bem-vindo de volta, {{ nome }}!</h1>
    <p>{{ email }}</p>
    <a href="{{ url_for('limpar') }}">Limpar dados</a>
  {% else %}
    <h1>Olá, visitante!</h1>
  {% endif %}

 
  <form action="{{ url_for('salvar') }}" method="POST">
    <label>Nome: <input type="text" name="nome" value="{{ nome }}"></label>
    <label>Email: <input type="email" name="email" value="{{ email }}"></label>
    <button type="submit">Salvar</button>
  </form>

 
  {% if tema == "claro" %}
    <a href="{{ url_for('tema', escolha='escuro') }}">🌙 Tema Escuro</a>
  {% else %}
    <a href="{{ url_for('tema', escolha='claro') }}">☀️ Tema Claro</a>
  {% endif %}

</body>
</html>
