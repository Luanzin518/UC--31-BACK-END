<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>Cadastro de Alunos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 40px auto;
      padding: 0 20px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #357abd;
    }
  </style>
</head>
<body>
    <h1>Formulário de Cadastro</h1>
    <form action="/validacao" method="POST">
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome"><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="cidade">Cidade:</label><br>
        <input type="text" id="cidade" name="cidade"><br><br>

         <label for="cidade">Telefone</label><br>
        <input type="text" id="telefone" name="telefone"><br><br>

         <label for="CPF">Cidade:</label><br>
        <input type="text" id="CPF" name="CPF"><br><br>

         <label for="Estado">Estado</label><br>
        <input type="text" id="Estado" name="Estado"><br><br>

         <label for="Curso">Curso:</label><br>
        <input type="text" id="Curso" name="Curso"><br><br>

         <label for="Idade">Curso:</label><br>
        <input type="text" id="Idade" name="Idade"><br><br>

         <label for="Senha">Curso:</label><br>
        <input type="text" id="Senha" name="Senha"><br><br>

        <button type="submit">Cadastrar</button>
    </form>
</body>
</html>
